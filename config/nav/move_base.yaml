# move_base 参数。障碍物不进代价地图：动态障碍由 safety_gate.py 处理（停车等待，不绕行）

base_global_planner: global_planner/GlobalPlanner
base_local_planner: dwa_local_planner/DWAPlannerROS

controller_frequency: 10.0
planner_frequency: 0.5          # 每 2 s 重新规划一次全局路径
controller_patience: 30.0
planner_patience: 10.0
oscillation_timeout: 0.0        # 停车等待障碍时不判为震荡
recovery_behavior_enabled: false
clearing_rotation_allowed: false
shutdown_costmaps: false

global_costmap:
  update_frequency: 1.0
  publish_frequency: 0.5
  rolling_window: false
  plugins:
    - {name: static_layer,    type: "costmap_2d::StaticLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

local_costmap:
  update_frequency: 5.0
  publish_frequency: 2.0
  rolling_window: true
  width: 6.0
  height: 6.0
  resolution: 0.05
  plugins:
    - {name: static_layer,    type: "costmap_2d::StaticLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
  # 局部代价地图把未知区域当可通行：DWA 检查车身轮廓时碰到未知格会判所有轨迹无效、车原地不动，
  # 而 Mid-360 地图的可通行区域只有走过的路线两侧约 0.45 m（近处看不到地面），车角常伸进未知区域。
  # 全局规划仍只走已知可通行区域（allow_unknown: false），实时防撞由 safety_gate 负责
  static_layer:
    map_topic: /map
    subscribe_to_updates: false
    track_unknown_space: false

GlobalPlanner:
  use_dijkstra: true
  allow_unknown: false          # 只走建图时确认过的可通行区域
  default_tolerance: 0.3        # 目标点在障碍内时，允许落到 0.3 m 内的可通行处
  cost_factor: 0.55
  neutral_cost: 66
  lethal_cost: 253

DWAPlannerROS:
  # 速度上限由网页设置（nav_bridge 通过 dynamic_reconfigure 修改），safety_gate 再限一次
  max_vel_x: 0.5
  min_vel_x: 0.0                # 不倒车
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_trans: 0.5
  min_vel_trans: 0.05
  max_vel_theta: 0.6
  min_vel_theta: 0.2
  # DWA 每个周期只在 当前速度 ± 加速度×0.1 s 内采样，且低于 min_vel_trans / min_vel_theta 的速度无效：
  # 加速度太小时静止状态下所有候选都无效，车原地不动（"DWA planner failed to produce path"）。
  # 必须 acc_lim_x×0.1 > min_vel_trans、acc_lim_theta×0.1 > min_vel_theta；平顺起步由 safety_gate 限制输出加速度
  acc_lim_x: 1.0
  acc_lim_y: 0.0
  acc_lim_theta: 3.0
  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.15
  latch_xy_goal_tolerance: true
  sim_time: 2.0
  vx_samples: 15               # 速度档细一些，减少忽快忽慢
  vth_samples: 20
  path_distance_bias: 32.0
  goal_distance_bias: 20.0
  occdist_scale: 0.02
  forward_point_distance: 0.4
  oscillation_reset_dist: 0.05
  holonomic_robot: false
