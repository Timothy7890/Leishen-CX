# 全局 / 局部代价地图共用参数（加载到 global_costmap 和 local_costmap 命名空间）
#
# 车身轮廓（body 系，x 向前，单位 m）。也是 scripts/vehicle.py 的唯一来源：
# 安全门的检测区域、建图/定位时去除车自身点都按这个轮廓。
#   前 +0.5、宽 0.8 沿用原 racebot 配置；
#   后 -0.75 来自数据：车尾两处部件在雷达后方 0.53~0.68 m（20261102_211608 录制中 >70% 的帧都扫到）
footprint: [[0.5, 0.4], [0.5, -0.4], [-0.75, -0.4], [-0.75, 0.4]]
robot_base_frame: base_link
global_frame: map
transform_tolerance: 0.5

static_layer:
  map_topic: /map
  subscribe_to_updates: false
  track_unknown_space: true

inflation_layer:
  inflation_radius: 0.6       # 离墙 0.6 m 内代价升高，路径尽量走中间
  cost_scaling_factor: 5.0
