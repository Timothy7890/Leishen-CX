# 全局 / 局部代价地图共用参数（加载到 global_costmap 和 local_costmap 命名空间）
#
# 车身轮廓（body 系，x 向前，单位 m）。也是 scripts/vehicle.py 的唯一来源：
# 安全门的检测区域、建图/定位时去除车自身点都按这个轮廓。
# body 原点水平位置与雷达中心重合；尺寸为实测（相对雷达中心）：
#   前 +0.16 m、后 -0.68 m、左右各 0.28 m（总长 0.84 m、总宽 0.56 m）
footprint: [[0.16, 0.28], [0.16, -0.28], [-0.68, -0.28], [-0.68, 0.28]]
robot_base_frame: base_link
global_frame: map
transform_tolerance: 0.5

static_layer:
  map_topic: /map
  subscribe_to_updates: false
  track_unknown_space: true

inflation_layer:
  inflation_radius: 0.6       # 离墙 0.6 m 内代价升高，路径尽量走中间
  cost_scaling_factor: 5.0
