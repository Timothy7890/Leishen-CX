# FAST-LIO 参数（360° 版本）。由 record.sh 通过 rosparam load 加载到全局命名空间。
# 相对原 ~/workspace/fast_lio 配置的改动：fov_degree 180 -> 360，blind 2 -> 0.8，
# dense_publish_en true -> false，timestamp_unit 2 -> 0

common:
    lid_topic:  "/velodyne_points"
    imu_topic:  "/imu"
    time_sync_en: false
    time_offset_lidar_to_imu: 0.0

preprocess:
    lidar_type: 2                # 2: Velodyne 格式（镭神驱动输出兼容）
    scan_line: 32
    scan_rate: 10                # Hz
    # 点云 time 字段单位: 0-s, 1-ms, 2-us, 3-ns。镭神驱动输出的是秒（每帧 0~0.1）；
    # 原配置误设为 2，FAST-LIO 运动补偿失效，转弯后地图出现重影
    timestamp_unit: 0
    # 小于该距离 (m) 的点不参与建图。车尾在雷达后方 0.68 m，车身点会被扫到；
    # 这些点跟着车走，会把里程计往"没动"拉；FAST-LIO 只能按半径过滤，故取 0.8
    blind: 0.8

mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree:    360
    det_range:     100.0
    extrinsic_est_en:  false
    # 雷达在 body 原点正上方；高度为实测离地/相对 body 原点 0.45 m
    extrinsic_T: [ 0, 0, 0.45]
    extrinsic_R: [ 1, 0, 0,
                   0, 1, 0,
                   0, 0, 1]

publish:
    path_en:  false
    scan_publish_en:  true
    # false: 地图只保存按 filter_size_surf (0.5 m) 降采样后的点。
    # true 会保留每帧全部点，360° 下内存约 +420 MB/分钟，长时间录制会耗尽内存；
    # 需要高密度地图时用 raw.bag 离线重建
    dense_publish_en: false
    scan_bodyframe_pub_en: true

pcd_save:
    pcd_save_en: true
    interval: -1                 # -1: 结束时保存为一个 scans.pcd

# 以下原写在 mapping_velodyne.launch 中
feature_extract_enable: false
point_filter_num: 4
max_iteration: 3
filter_size_surf: 0.5
filter_size_map: 0.5
cube_side_length: 1000.0
runtime_pos_log_enable: false
